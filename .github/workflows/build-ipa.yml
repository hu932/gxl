name: 构建黄油可颂 IPA（免签）

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter（最新稳定版）
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 环境诊断
        run: |
          flutter --version
          xcodebuild -version

      - name: 构建 IPA
        run: bash setup_and_build.sh

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: 黄油可颂-免签IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30

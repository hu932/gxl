name: 构建黄油可颂 IPA（免签）

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 构建 IPA
        run: |
          set +e
          bash setup_and_build.sh > build.log 2>&1
          rc=$?
          set -e
          echo "==== 构建退出码: $rc ===="
          tail -n 80 build.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::构建失败，退出码 $rc"
            tail -n 80 build.log | sed 's/^/::error::/'
          fi
          exit $rc

      - name: 上传 IPA 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 黄油可颂-免签IPA
          path: |
            build/ios/ipa/*.ipa
            build/ios/iphoneos/*.ipa
          if-no-files-found: warn
          retention-days: 30

name: 构建黄油可颂 IPA（免签）

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 构建 IPA
        run: |
          set -x
          bash setup_and_build.sh 2>&1 | tee build.log
        continue-on-error: true

      - name: 失败时输出日志注解
        if: failure()
        run: tail -n 60 build.log | sed 's/^/::error::/'

      - name: 上传 IPA 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 黄油可颂-免签IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 30

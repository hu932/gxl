name: 构建黄油可颂 IPA（免签）

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 构建 IPA
        id: build
        run: |
          set +e
          bash setup_and_build.sh > build.log 2>&1
          rc=$?
          set -e
          echo "==== 构建退出码: $rc ===="
          tail -n 60 build.log
          mkdir -p ci-logs
          cp build.log ci-logs/build.txt
          echo "exit_code=$rc" > ci-logs/result.txt
          exit $rc

      - name: 回传日志到仓库（便于远程排查）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add -f ci-logs
          git commit -m "CI 构建日志 [skip ci]" || true
          git push || true

      - name: 上传 IPA 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 黄油可颂-免签IPA
          path: |
            build/ios/ipa/*.ipa
            build/ios/iphoneos/*.ipa
          if-no-files-found: warn
          retention-days: 30
